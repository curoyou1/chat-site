<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Chat Portal</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ui-overrides.css?v=9" />
  </head>
  <body>
    <div id="loginScreen" class="screen active">
      <div class="login-card">
        <div class="brand-wrap"><div class="brand-mark">C</div><h1>curochat</h1></div>
        <div class="form-group"><label for="loginUsername">ユーザー名</label><input id="loginUsername" type="text" autocomplete="username" /></div>
        <div class="form-group"><label for="loginPassword">パスワード</label><input id="loginPassword" type="password" autocomplete="current-password" /></div>
        <div class="form-group"><label for="adminPassword">管理者パスワード（任意）</label><input id="adminPassword" type="password" autocomplete="off" /></div>
        <button id="loginButton" class="primary-btn">ログイン</button>
        <button id="showRegisterButton" class="secondary-btn">新規登録</button>
      </div>
    </div>
    <div id="registerScreen" class="screen hidden">
      <div class="login-card register-card">
        <div class="brand-wrap"><div class="brand-mark">+</div><h1>新規登録</h1></div>
        <div class="form-group"><label for="registerUsername">ユーザー名</label><input id="registerUsername" type="text" autocomplete="off" /></div>
        <div class="form-group"><label for="registerPassword">パスワード</label><input id="registerPassword" type="password" autocomplete="new-password" /></div>
        <div class="form-group"><label for="registerConfirm">パスワード確認</label><input id="registerConfirm" type="password" autocomplete="new-password" /></div>
        <button id="registerButton" class="primary-btn">アカウント作成</button>
        <button id="backToLoginButton" class="secondary-btn">戻る</button>
      </div>
    </div>
    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="sidebar-header"><span>オンライン</span><span id="onlineCount" class="count-pill">0</span></div>
        <div id="onlineList" class="online-list"></div>
      </aside>
      <main class="chat-panel">
        <header class="chat-header"><div><div class="header-title">Global Chat</div><div id="headerUser" class="header-user"></div></div></header>
        <div id="messageList" class="message-list"></div>
        <div id="adminTools" class="admin-tools hidden"></div>
        <div class="composer-wrap">
          <div id="replyPreview" class="reply-preview hidden"></div>
          <div class="composer-row">
            <textarea id="chatInput" rows="4" placeholder="メッセージを入力... (Enterで改行)"></textarea>
            <label class="file-upload"><input id="mediaInput" type="file" accept="image/*,video/*" /><span>写真/動画</span></label>
            <button id="sendButton" class="primary-btn">送信</button>
          </div>
        </div>
      </main>
    </div>
    <button id="logoutButton" class="logout-btn">ログアウト</button>
    <script src="app.js?v=3"></script>
  </body>
</html>
